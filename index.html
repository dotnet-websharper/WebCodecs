<!DOCTYPE html>
<html lang="en">
<head>
    <title>WebCodecs API</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="Content/WebSharper.WebCodecs.Sample.css" />
    <style>
        /* Don't show the not-yet-loaded templates */
        [ws-template], [ws-children-template] { display: none; }
    </style>
    <script type="module" src="Content/WebSharper.WebCodecs.Sample.head.js"></script>
</head>
<body>
    <h1>WebCodecs API - Encode a Frame</h1>
    <div id="main" ws-children-template="Main">
        <canvas id="canvas" width="640" height="360"></canvas>
        <br />
        <button ws-onclick="EncodeFrame">Encode Frame</button>
        <p ws-replace="EncodeResult"></p>
    </div>
    <script type="module" src="Content/WebSharper.WebCodecs.Sample.min.js"></script>
</body>
</html>
